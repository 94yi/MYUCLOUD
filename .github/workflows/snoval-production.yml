name: Snoval production

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and test without publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: snoval-production
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == '94yi/MYUCLOUD' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            geport/package-lock.json
      - name: Test and build both pages
        run: |
          npm ci
          npm ci --prefix geport
          npm test
          npm run build:snoval
          test -s dist/index.html
          test -s dist/geport/index.html
          jq -n --arg revision "$GITHUB_SHA" '{branch:"master",revision:$revision}' > dist/snoval-release.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: snoval-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  verify-cloudflare:
    if: vars.SNOVAL_AUTODEPLOY == 'true' || inputs.dry_run == true
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: snoval-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify deployment credentials without publishing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 .github/scripts/verify-snoval-cloudflare.py

  deploy:
    if: vars.SNOVAL_AUTODEPLOY == 'true' && inputs.dry_run != true
    needs: [build, verify-cloudflare]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: snoval-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - run: npm ci
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: snoval-dist
          path: dist
      - name: Check this is still the master tip
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)
          if [[ "$tip" == "$GITHUB_SHA" ]]; then echo 'current=true' >> "$GITHUB_OUTPUT"; else echo 'Superseded by a newer master commit; skipping deployment.' >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Publish the tested build
        if: steps.tip.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo '::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the snoval-production environment.'
            exit 1
          fi
          set -euo pipefail
          tag="snoval-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          # Versions do not synchronize routes, domains, or cron triggers.
          ./node_modules/.bin/wrangler versions upload --keep-vars --tag "$tag"
          ./node_modules/.bin/wrangler versions deploy --version-tag "$tag@100" --yes
      - name: Verify live release
        if: steps.tip.outputs.current == 'true'
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if curl --silent --show-error --fail --max-time 15 \
              "https://snoval.link/snoval-release.json?release=$GITHUB_RUN_ID-$attempt" \
              | jq -e --arg revision "$REVISION" '.revision == $revision' >/dev/null; then
              node scripts/verify-live.js
              echo 'Published and verified https://snoval.link/#study' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo '::error::Cloudflare accepted the deployment, but the new release marker is not live. Inspect the Worker deployment and roll back if needed.'
          exit 1
