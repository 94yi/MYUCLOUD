<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geport · 实验报告封面</title>
    <style>
      /* Force light mode to prevent dark mode overrides causing white text on white background */
      :root {
        color-scheme: light;
      }

      /* Custom print styles to ensure background graphics and exact layout */
      @media print {
        @page {
          size: A4;
          margin: 0;
        }
        body {
          -webkit-print-color-adjust: exact;
        }
      }
      /* Utility for text-align-last */
      .text-justify-last {
        text-align-last: justify;
        text-align: justify;
      }
    </style>


</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
